<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="favicon-64.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Palette cliente: grigio antracite + rosso */
:root{--r:#c8102e;--g:#3a3f45;--bg:#eceef1;--card:#fff;--tx:#1d2125;--mu:#646b74;--ln:#d5d9de;--ok:#1d7f46}
[data-theme=dark]{--bg:#15171a;--card:#212429;--tx:#e7e9ec;--mu:#9aa1a9;--ln:#363b42;--g:#2a2e33}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--r);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:4px solid var(--r)}
header img{width:34px;height:34px;object-fit:contain;border-radius:7px;background:#fff;padding:2px}
header h1{font-size:15px;margin:0;flex:1;line-height:1.15;min-width:0}header h1 span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;font-weight:400;opacity:.75;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:none;border:1px solid #ffffff4d;color:#fff;border-radius:8px;padding:3px 6px;font-size:10px;line-height:1.15;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:42px}.hb b{font-size:16px;font-weight:400}
#dot{width:11px;height:11px;border-radius:50%;background:#8a8f96;flex:none;cursor:pointer;border:2px solid #fff3}
main{padding:12px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;padding:15px 2px 13px;color:var(--mu);font:inherit;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav button b{font-size:25px;font-weight:400}nav button.on{color:var(--r);box-shadow:inset 0 3px var(--r)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.btn{background:var(--r);color:#fff;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.98)}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.ok{background:var(--ok)}.btn.sm{padding:6px 10px;font-size:13px}.btn.w{width:100%;margin-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns .btn{flex:1}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}.row>input{flex:1;margin:0}
label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 0}
details.pub summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--r);list-style:none;padding:4px 0}details.pub summary::-webkit-details-marker{display:none}details.pub summary::after{content:' ▾';color:var(--mu)}details.pub[open] summary::after{content:' ▴'}
input[type=range]{width:100%;padding:0;background:none;border:0;accent-color:var(--r);margin:6px 0 2px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:10px;margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.mic{display:flex;gap:6px;align-items:flex-start}.mic textarea{flex:1}.mic .btn{margin-top:3px}
.bin{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:8px;padding:12px;border-radius:12px;border:2px solid;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}.bin b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:0 0 auto}.bin.y{border-color:#e0a800}.bin.y b{background:#ffd34d}.bin.r{border-color:#c8102e}.bin.r b{background:#c8102e}.bin:active{filter:brightness(.8)}details.arc{margin-bottom:8px}details.arc>summary{cursor:pointer;font-weight:700;padding:8px 2px}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.ct>*:first-child{min-width:0;flex:1;overflow-wrap:anywhere;word-break:break-word}.ct>*:last-child{flex:0 0 auto;max-width:48%}html{-webkit-text-size-adjust:100%}.li>:first-child{min-width:0;overflow-wrap:anywhere}
.mu{color:var(--mu)}.sm{font-size:12.5px}p{margin:6px 0}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--ln);white-space:nowrap}
.badge.ok{background:#1d7f461f;color:var(--ok);border-color:#1d7f4659}.badge.r{background:#c8102e17;color:var(--r);border-color:#c8102e55}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden;flex:1}
.seg button{flex:1;border:0;background:none;padding:9px 4px;color:var(--mu);font:inherit;font-size:13px;cursor:pointer}.seg button.on{background:var(--g);color:#fff}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.mbox{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:4px solid var(--r)}
@media(min-width:600px){#modal{align-items:center}.mbox{border-radius:14px}}
h3{margin:0 0 6px}h4{margin:14px 0 6px;font-size:14px;color:var(--r)}.card h4:first-child{margin-top:0}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.sig{width:100%;height:190px;background:#fff;border:2px dashed var(--ln);border-radius:10px;touch-action:none;margin-top:8px;display:block}
.fthumb{height:42px;background:#fff;border-radius:4px;margin-top:4px;display:block}
#toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#24282d;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.25s;z-index:50;max-width:92%;font-size:14px;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:10px 0}
.kpi div{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--r);border-radius:10px;padding:8px 10px}.kpi b{display:block;font-size:22px}.kpi span{font-size:11.5px;color:var(--mu)}
canvas.ch{width:100%;height:220px;display:block}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}tr.bad td{color:var(--r);font-weight:600}
.auth{max-width:420px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px}
.auth .brand{text-align:center;margin-bottom:16px}.auth .brand img{width:86px;height:86px;object-fit:contain}
#vo{position:fixed;left:12px;right:12px;bottom:calc(112px + env(safe-area-inset-bottom));background:var(--g);color:#fff;border-radius:14px;padding:14px;z-index:40;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0006}
#nav button.rd{color:#fff;background:var(--r);animation:rd 1.6s infinite}@keyframes rd{50%{opacity:.7}}@media(prefers-reduced-motion:reduce){#nav button.rd{animation:none}}
#vo .pulse{width:14px;height:14px;border-radius:50%;background:var(--r);animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){#vo .pulse{animation:none}#toast{transition:none}}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}.tile>b{font-size:22px;width:30px;text-align:center}
.info p,.info li{font-size:14px}.info ul{padding-left:18px}
#bc{font-style:normal;background:var(--r);border-radius:10px;padding:0 5px;font-size:11px;margin-left:2px}#bc:empty{display:none}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:8px 0}.chk input{width:auto;margin:0}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
a{color:var(--r)}
/* feedback al tocco: ogni pulsante cambia colore alla pressione */
.btn,.hb,nav button,.tile,.seg button{transition:background-color .1s,filter .1s,transform .1s,color .1s}
.btn:active,.btn.prs{filter:brightness(.7);transform:scale(.96)}.btn.sec:active,.btn.sec.prs{background:var(--ln);filter:none}
.hb:active,.hb.prs{background:#ffffff4d}nav button:active,nav button.prs{background:#c8102e29;color:var(--r)}
.tile:active,.tile.prs{background:var(--ln)}.seg button:active,.seg button.prs{background:var(--r);color:#fff}
.ic{display:inline-block;margin-right:5px}.mic .btn{white-space:nowrap}a.btn{display:block;text-align:center;text-decoration:none}
.chat{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}.msg{max-width:84%;padding:7px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);font-size:14px}
.msg.me{align-self:flex-end;background:#c8102e17;border-color:#c8102e55}.msg small{display:block;color:var(--mu);font-size:11px}
.bar{height:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%}
#bgl{position:fixed;inset:0;z-index:4;pointer-events:none;background:center/min(70vw,70vh) no-repeat;opacity:.09}
#gd{position:fixed;left:8px;right:8px;top:calc(64px + env(safe-area-inset-top));z-index:30;background:var(--g);color:#fff;border-radius:12px;padding:10px 12px;display:none;gap:10px;align-items:center;box-shadow:0 6px 24px #0006;font-size:14px;max-width:560px;margin:auto}
#gd.on{display:flex}#gd span{flex:1}#gd .btn{background:#fff;color:#1d2125;white-space:nowrap}
.fgrande{width:100%;max-width:300px;background:#fff;border:1px solid var(--ln);border-radius:6px;display:block;margin-top:6px}
</style></head>
<body>
<div id="bgl"></div><div id="gd" role="status" aria-live="polite"><span id="gT"></span><button class="btn sm" onclick="salta()">Salta guida ⏭</button></div>
<div id="auth"></div>
<div id="shell" hidden>
<header><img id="hLogo" alt="Logo"><h1><span id="hAz">Vigilanza Privata</span><small id="hUser"></small></h1>
<span id="dot" onclick="toast(this.title)" title=""></span>
<button class="hb" id="hVoce" onclick="setVoce(!voceOn())" aria-label="Voce guida"><b id="hVi">🔊</b>Voce</button>
<button class="hb" onclick="go('promemoria')" aria-label="Avvisi"><b>🔔</b>Avvisi<i id="bc"></i></button>
<button class="hb" onclick="info()" aria-label="Informazioni"><b>ⓘ</b>Info</button>
<button class="hb" onclick="logout()"><b>⏻</b>Esci</button></header>
<main id="main"></main><nav id="nav"></nav></div>
<div id="modal"></div><div id="toast"></div>
<script>
/* ============ COSTANTI E STATO ============ */
const VER='1.4.0',RET=180,API='/.netlify/functions/sync'; // RET = giorni di conservazione di firme e posizioni GPS
const COLS=['utenti','servizi','risposte','presenze','promemoria','log','impostazioni','chat','richieste','gps','posizioni','equipaggio'];
const RUOLI={admin:'Amministratore',tecnico:'Tecnico (volontario)',lettura:'Sola lettura',cliente:'Cliente (richiedente degli eventi)'};
const RISERV={volontari:'Gestione volontari',export:'Esportazioni Excel e CSV',storico:'Storico azioni',backup:'Backup e ripristino',sicurezza:'Dati azienda e sicurezza'};
const LOGO='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 4 8 13v17c0 15 10 26 24 30 14-4 24-15 24-30V13z" fill="#3a3f45"/><path d="M32 10 14 17v13c0 11 7 20 18 24 11-4 18-13 18-24V17z" fill="#c8102e"/><path d="m22 32 7 7 14-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('Memoria del dispositivo piena: esporta un backup')}}};
let DB=LS.g('vp_db',{});COLS.forEach(c=>DB[c]??={});
let Q=LS.g('vp_queue',[]),CREDS=LS.g('vp_creds',{}),SES=LS.g('vp_session',null),SEQ=LS.g('vp_seq',0);
const S={view:'servizi',online:null,syncing:false,pinOk:false,lastAct:Date.now(),idle:0,period:90,alerts:[]};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const me=()=>SES&&DB.utenti[SES.uid],role=()=>me()?.ruolo||'lettura';
const cfg=()=>DB.impostazioni.cfg||{id:'cfg',azienda:'Agenzia Vigilanza Privata',riservate:[],timeout:5};
const live=c=>Object.values(DB[c]).filter(r=>!r.deleted&&!(c==='presenze'&&r.escluso));
const nomeU=id=>{const u=DB.utenti[id];return u?u.nome+' '+u.cognome:'Utente'};
const saveDB=()=>LS.s('vp_db',DB);
/* ============ DATE ============ */
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
const fmtT=t=>new Date(t).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'});
const hm=t=>new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const byDate=(a,b)=>(a.data+a.oraInizio).localeCompare(b.data+b.oraInizio);
const dur=s=>{const m=x=>{const[h,mm]=x.split(':');return h*60+ +mm};let d=m(s.oraFine)-m(s.oraInizio);if(d<=0)d+=1440;return Math.round(d/15)/4};
const inPer=d=>S.period==='all'||new Date(d+'T12:00')>=Date.now()-S.period*864e5;
const statoP=p=>p?.stato||(p?.checkOut?'presente':p?.checkIn?'in servizio':'');
// Ore di volontariato complessive di un utente (tutte le presenze confermate, senza limite di periodo)
const TRAG=30;
const oreU=id=>Math.round(live('presenze').filter(p=>p.utenteId===id&&['presente','in servizio'].includes(statoP(p))&&DB.servizi[p.servizioId]&&!DB.servizi[p.servizioId].deleted).reduce((a,p)=>a+(+p.ore||0),0)*100)/100;
// Stendardo di ringraziamento al raggiungimento di 30 ore; altrimenti barra di avanzamento
function stendardo(id,mio){const o=oreU(id),n=nomeU(id);
 if(o>=TRAG)return`<div class="card" style="background:linear-gradient(135deg,var(--g),var(--r));color:#fff;text-align:center;border:0"><div style="font-size:30px">🏅</div><b style="font-size:17px">${mio?'Grazie':'Grazie a '+esc(n)}!</b><p style="margin:4px 0">${mio?'Hai':'Ha'} raggiunto <b>${o} ore</b> di volontariato.<br>Il tuo tempo rende più sicura la nostra comunità.</p></div>`;
 return mio?`<div class="card"><div class="ct"><b>Le mie ore di volontariato</b><span>${o} / ${TRAG} h</span></div><div style="height:8px;background:var(--bg);border-radius:6px;margin-top:8px;overflow:hidden"><div style="height:100%;width:${Math.round(o/TRAG*100)}%;background:var(--r)"></div></div><p class="mu sm">Mancano ${Math.round((TRAG-o)*100)/100} ore al traguardo di ${TRAG}: ti aspetta un ringraziamento speciale.</p></div>`:''}
/* ============ UI BASE ============ */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3400)}
function modal(h,g){if(g)parla(GMOD[g]);$('#modal').innerHTML=`<div class="mbox" role="dialog">${h}</div>`;$('#modal').classList.add('on')}
function closeM(){S.chat=null;$('#modal').classList.remove('on');$('#modal').innerHTML=''}
const inp=(id,l,v='',t='text',x='')=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}" ${x}></label>`;
const ta=(id,l,v='')=>`<label>${l}<span class="mic"><textarea id="${id}" rows="3">${esc(v)}</textarea><button type="button" class="btn sec sm" onclick="mic('${id}')" aria-label="Detta">🎤 Detta</button></span></label>`;
const val=id=>$('#'+id).value.trim();
const seg=(k,opts,cur)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${cur==v?'on':''}" onclick="S.${k}=${typeof v==='number'?v:`'${v}'`};render()">${l}</button>`).join('')}</div>`;
function download(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
const theme=()=>LS.g('vp_theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function setTheme(t){LS.s('vp_theme',t);document.documentElement.dataset.theme=t;render()}
/* ============ CRITTOGRAFIA (PBKDF2-SHA-256, Web Crypto) ============ */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbk(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(salt),iterations:100000,hash:'SHA-256'},k,256))}
async function mkPw(pass){const salt=hex(crypto.getRandomValues(new Uint8Array(16)));return{salt,hash:await pbk(pass,salt)}}
/* ============ DATI, CODA, REGISTRO ============ */
// Salva un record in locale e lo mette in coda per il cloud (una sola voce per record)
function put(col,rec,extra){rec.updatedAt=Date.now();rec.updatedBy=SES?.uid||'';DB[col][rec.id]=rec;saveDB();
 const i=Q.findIndex(q=>q.col===col&&q.rec.id===rec.id),keep=i>=0&&Q[i].rec.pw&&!extra?.pw?{pw:Q[i].rec.pw}:{};
 const it={col,rec:{...rec,...keep,...extra}};i>=0?Q[i]=it:Q.push(it);LS.s('vp_queue',Q);col==='chat'||schedSync()}
function logA(azione,tipo='azione',esito=''){if(SES)put('log',{id:uid(),ts:Date.now(),utenteId:SES.uid,tipo,azione,esito})}
/* ============ CLOUD E SINCRONIZZAZIONE ============ */
async function api(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout?.(15000)});
 if(!(r.headers.get('content-type')||'').includes('json'))throw new Error('offline');const j=await r.json();j._st=r.status;return j}
let syncT;function schedSync(){clearTimeout(syncT);syncT=setTimeout(sync,1500)}
function resetLocale(){Object.keys(localStorage).filter(k=>/^vp_/.test(k)&&!/theme|voce|suono/.test(k)).forEach(k=>localStorage.removeItem(k));location.reload()}
async function sync(manual){
 if(S.syncing)return;if(!SES?.token){if(manual)toast('Nessuna sessione cloud: usa "Collega al cloud" o accedi con connessione');return dot()}
 if(!navigator.onLine){S.online=false;if(manual)toast('Sei offline: i dati restano in coda');return dot()}
 S.syncing=true;dot();const sent=Q.slice();
 try{const r=await api({action:'sync',token:SES.token,since:SEQ,changes:sent});
  if(r._st===401){const st=await api({action:'status'}).catch(()=>null);if(st?.setup){toast('Il cloud è stato azzerato: l\'app riparte da zero');return setTimeout(resetLocale,1800)}SES.token=null;LS.s('vp_session',SES);S.online=true;toast('Sessione cloud scaduta: esci e accedi di nuovo con connessione')}
  else if(r.err)throw new Error(r.err);
  else{Q=Q.filter(q=>!sent.some(s=>s.col===q.col&&s.rec.id===q.rec.id&&s.rec.updatedAt===q.rec.updatedAt));LS.s('vp_queue',Q);
   let ch=0,nc=[],rs=0,ng=0;for(const{col,rec}of r.recs){if(!DB[col])continue;const l=DB[col][rec.id];if(col==='equipaggio'&&l&&JSON.stringify({...l,updatedAt:0})===JSON.stringify({...rec,updatedAt:0})){DB[col][rec.id]=rec;continue}if(col==='gps'&&!l&&role()==='tecnico')ng=1;if(col==='utenti'&&rec.id===SES.uid&&l&&l.ruolo!==rec.ruolo)rs=1; // cambio del proprio ruolo: serve risincronizzare tutto

/* ============ INFORMAZIONI ============ */
function info(){modal(`<div class="info"><h3>ⓘ Vigilanza Privata</h3><p class="mu sm">Versione ${VER}</p>
<p>L'app gestisce le <b>richieste di servizio</b> ai volontari, raccoglie le <b>disponibilità</b> e registra le <b>presenze reali</b>. Il coordinatore vede chi ha dato servizio, dove, quando e per quante ore; ogni volontario ha lo storico delle proprie disponibilità e dei servizi svolti.</p>
<h4>Schermate</h4><ul>
<li><b>Servizi</b>: il coordinatore crea le richieste (evento, luogo, data, orario, volontari necessari). Ogni volontario risponde Disponibile o Non disponibile, anche a voce con 🎤. La risposta viene salvata con data e ora. Il Dettaglio volontari mostra chi ha accettato, chi ha rifiutato e chi non ha risposto, permette di confermare la presenza e apre <b>Firme e posizioni</b>: firma ingrandita, <b>indirizzo</b> di entrata e uscita con link alla mappa, km percorsi e PDF da scaricare.</li>
<li><b>Turno</b>: nel giorno del servizio il volontario fa check-in e check-out. All'entrata e all'uscita l'app ti avvisa se non sei a casa, al ritrovo o al luogo del servizio e salva l'<b>indirizzo con civico e paese</b> (non latitudine e longitudine) e i <b>km percorsi</b>; a fine turno si firma sullo schermo. Sotto trovi il tuo storico, le tue ore di volontariato e, al traguardo delle 30 ore, lo stendardo di ringraziamento 🏅.</li>
<li><b>Statistiche</b>: presenze, ore, assenze dopo il sì e tasso di risposta nel periodo scelto, con grafici, km percorsi, tabella di affidabilità (con le ore totali di ogni volontario), esportazione Excel e <b>Archivio firme</b> catalogato per evento (anno, mese, evento) con PDF.</li>
<li><b>Calendario ricorrenze</b> (Statistiche, solo gestore): i servizi raggruppati per <b>comune, mese e settimana del mese</b>; se lo stesso evento torna ogni anno nello stesso periodo l'app propone la data dell'anno dopo (stesso giorno della settimana) e la esporta in Excel. Il comune si ricava dal luogo o lo scrivi nel servizio.</li>
<li><b>Volontari</b> (solo amministratore): anagrafica con indirizzo di casa, ruolo, password, sospensione, <b>eliminazione</b> con il tasto 🗑: una seconda schermata offre il cestino giallo (solo l'utente: non accede più, presenze e storico restano) o rosso (anche presenze, storico e statistiche, mai le firme), e l'informativa privacy.</li>
<li><b>Altro</b>: Promemoria e scadenze, Storico azioni, Impostazioni, Informazioni.</li></ul>
<h4>Ruoli</h4><ul><li><b>Amministratore</b>: tutte le funzioni, compresa la conferma delle presenze.</li><li><b>Tecnico (volontario)</b>: risponde alle richieste, fa check-in e check-out, vede solo i propri dati.</li><li><b>Sola lettura</b>: consulta servizi, statistiche e storico.</li></ul>
<h4>Lavoro senza connessione</h4><p>Ogni operazione viene salvata subito sul dispositivo e messa in coda. Al ritorno della rete parte da sola verso il cloud. Il pallino in alto indica lo stato: verde sincronizzato, rosso offline, giallo in corso, grigio solo locale. Se due dispositivi modificano lo stesso dato vince l'ultima modifica, e lo scarto viene annotato nello Storico azioni.</p>
<h4>Ruolo Cliente (chi richiede l'evento)</h4><p>Il gestore crea un utente con ruolo <b>Cliente</b> e lo sceglie nel servizio (campo Cliente). Il cliente vede <b>solo i propri eventi</b> e lo storico per anno. Dal <b>check-in</b> vede nome e cognome dei volontari in servizio e può <b>chiamarli</b>; non vede indirizzi, ore né chi ha rifiutato. Con <b>Verifica presenza (GPS)</b> chiede la posizione ai volontari in turno: la vede su mappa solo di chi ha attivato in Impostazioni «Consenti al cliente di verificare la mia posizione» (a scelta del volontario, solo tra check-in e check-out; le coordinate sono cancellate poche ore dopo). Può usare la <b>chat di gruppo</b> con i volontari dal momento del primo check-in e la <b>chat con il gestore</b> sempre, e <b>richiedere un nuovo evento</b>: il gestore la approva (nasce il servizio già assegnato) o la rifiuta con un motivo, da Altro › Richieste e chat dei clienti.</p><h4>Turno: avvisi, check-in e chiusura automatica</h4><p>Dal giorno dell'evento, dopo il tuo <b>Disponibile</b>, il pulsante <b>Turno</b> diventa <b>rosso</b> finché non fai il check-out. Il <b>check-in</b> si attiva <b>30 minuti prima dell'inizio</b>, con un conto alla rovescia in minuti. Con le notifiche attive ricevi un avviso 30 minuti prima dell'inizio se non hai fatto il check-in e <b>30 minuti dopo la fine</b> se hai dimenticato il check-out (ripetuti dopo 5 minuti; toccandoli si apre Turno). Se dimentichi il check-out, <b>2 ore dopo la fine</b> il turno si chiude da solo all'ora di fine evento e le ore vengono registrate; gli <b>amministratori ricevono un avviso</b> e possono correggere l'orario da Dettaglio volontari › Presenza (anche dopo il blocco, per 30 giorni). Le ore sono calcolate dall'ora reale di check-in e check-out. Se il gestore cambia il tuo ruolo, l'app scarica di nuovo tutti i dati.</p><h4>Sfondo e voce guida</h4><p>Il logo inserito dal gestore in Impostazioni resta sullo sfondo in semitrasparenza: in Impostazioni › Aspetto e avvisi scegli quanto è visibile (o lo nascondi). La <b>voce guida</b> (🔊 in alto, oppure Impostazioni) dice cosa fare a ogni schermata e a ogni finestra; con <b>Salta guida</b> la interrompi. Dopo <b>Disponibile</b> ti invita a premere <b>Turno</b> all'ora d'inizio per il check-in, e dopo il check-in ti ricorda il <b>check-out</b> a fine evento o se vai via prima. Si attiva e si disattiva in qualsiasi momento; sempre in Impostazioni scegli la velocità della voce e se mostrare o nascondere il banner con il testo.</p><h4>Avvisi</h4><p>La campanella segnala nuove richieste senza risposta, i tuoi servizi delle prossime 24 ore e i promemoria. Se attivi le notifiche, arrivano anche sul dispositivo.</p><h4>Promemoria e notifiche push</h4><p>Il gestore crea un <b>promemoria</b> (titolo, testo, data e ora) non legato ad alcun evento e lo invia a <b>tutti</b> o ai volontari che <b>spunta</b>. La notifica arriva <b>solo alla data e all'ora esatte</b> e si ripete <b>una volta dopo 5 minuti</b>, anche con l'app chiusa (notifica push: serve aver dato il permesso notifiche; su iPhone l'app va prima aggiunta alla schermata Home, iOS 16.4 o successivo). Toccando la notifica si apre una <b>chat del promemoria</b>: il volontario scrive e sceglie <b>📨 Al gestore</b> oppure <b>👥 A tutti i destinatari</b>; il gestore risponde a tutti o a uno solo. La chat dura 7 giorni dall'ora del promemoria e si aggiorna al massimo ogni 30 secondi.</p><h4>Servizi passati e Cestino</h4><p>Sei ore dopo la fine, il servizio mostra un 🔒: nessuno (volontari e gestore) può più modificare risposte, presenze, firme e dati del servizio; il gestore può solo cestinarlo. Elementi eliminati vanno nel <b>Cestino</b> (Altro, solo gestore) da cui si ripristinano; dopo <b>180 giorni</b> vengono cancellati in modo definitivo e per gli utenti resta solo il nome per lo storico.</p>
<h4>Permessi del dispositivo</h4><p>All'accesso l'app chiede il permesso del <b>microfono</b>; GPS e notifiche vengono chiesti solo quando servono. Se li neghi l'app continua a funzionare con l'inserimento manuale. Ogni richiesta, concessa o negata, finisce nello Storico azioni.</p>
<h4>Sicurezza e privacy</h4><p>Le password non vengono mai salvate in chiaro (PBKDF2 SHA-256 con sale). L'amministratore può proteggere con PIN le funzioni riservate. La posizione viene rilevata solo a inizio e fine turno, mai in modo continuo, e si salva come indirizzo. Per l'indirizzo e i km l'app interroga i servizi gratuiti OpenStreetMap (Nominatim) e OSRM, a cui arrivano le coordinate necessarie al calcolo. Firme e indirizzi di entrata e uscita sono conservate <b>180 giorni</b> e poi cancellate automaticamente; presenze e ore restano per le statistiche. I dati personali vanno trattati secondo l'informativa consegnata ai volontari.</p>
<h4>Sede e indirizzi</h4><p>Alla prima configurazione il gestore dichiara la <b>sede associativa</b> (via, civico, CAP, città o posizione GPS). Ogni volontario ha il proprio indirizzo di casa (via, n. civico, città, CAP): lo inserisce il gestore oppure lo completa o modifica l'utente stesso da Impostazioni › Il mio profilo › Modifica i miei dati e indirizzo (insieme a cellulare ed email; l'app lo segnala finché l'indirizzo manca). Nome, cognome, ruolo e nome utente li cambia solo il gestore. Gli indirizzi vengono localizzati con OpenStreetMap, senza chiavi né costi. Per ogni servizio il gestore indica il <b>luogo del servizio</b> e il <b>luogo di ritrovo in sede</b>.</p>
<h4>Distanza e navigatore</h4><p>Ai check-in e check-out l'app calcola i <b>km su strada reali</b> da casa, dal ritrovo e dal luogo del servizio (se il servizio non risponde usa una stima, segnalata) e li porta nel report Excel. Dalle notifiche e dalle schede dei servizi il pulsante <b>📏 Distanza da casa</b> mostra una stima (km e minuti) dal tuo indirizzo. Dopo aver accettato un servizio compaiono <b>🧭 Sede di Ritrovo</b> e <b>🧭 Luogo del Servizio</b>, che aprono il navigatore del telefono (Google Maps o Apple Mappe).</p>
<h4>Chat dell'evento</h4><p>Dal servizio, con 💬 Chat evento, chi ha accettato e il gestore si scrivono. La chat si aggiorna <b>al massimo ogni 30 secondi</b> e si azzera 48 ore dopo la fine dell'evento. Il gestore può attivarla o disattivarla in Impostazioni. <b>Se ne consiglia l'uso solo con un server proprietario o un piano di abbondanti crediti</b>, per non consumare quelli gratuiti.</p>
<h4>Microfono e schermo</h4><p>Il microfono si ferma con un tocco; i campi di testo non ingrandiscono più lo schermo sugli smartphone.</p><h4>Suono e vibrazione</h4><p>Alle notifiche l'app emette un suono breve e fa vibrare il dispositivo, se disponibili; si disattivano in Impostazioni.</p>
<h4>Consumo del server</h4><p>Il gestore vede una barra con i crediti mensili usati (limite 300, poi il sito si ferma). Riceve un avviso a 100, 200 e 250 con la stima di quanto si può ancora usare l'app, oppure di passare a un piano a pagamento o a un altro server. È una stima: pubblicazioni e traffico del sito non sono misurati.</p>
<h4>Schermi e pulsanti</h4><p>Ogni pulsante ha icona e testo e cambia colore quando lo premi; il menu in basso ha pulsanti più alti. Nelle richieste di servizio il pulsante Disponibile (verde) o Non disponibile (rosso) si colora solo dopo la tua scelta. Il <b>tema chiaro o scuro</b> si sceglie in Impostazioni.</p>
<h4>Firma e cifratura</h4><p>In Impostazioni il gestore sceglie se richiedere la <b>firma</b> a fine turno. Con la variabile <b>DATA_KEY</b> su Netlify i dati nel cloud (anagrafica, indirizzi, GPS, firme, chat) e le impronte delle password sono <b>cifrati</b> (AES-256); Impostazioni mostra se la cifratura è attiva. Conserva la chiave: senza non si leggono più i dati.</p><h4>Prove e azzeramento</h4><p>Il cloud conserva i dati anche quando ripubblichi il sito. Per ripartire da zero: il gestore usa <b>Impostazioni › Azzera tutti i dati nel cloud</b> (chiede password e conferma), oppure su Netlify imposta la variabile <b>RESET_ON_DEPLOY=true</b> per azzerare a ogni nuova pubblicazione (da togliere quando l'app va in uso reale).</p>
<p>Per tenere i volontari e cambiare solo l'amministratore: il gestore può promuovere un altro utente ad <b>Amministratore</b> da Volontari › Modifica; oppure su Netlify imposta <b>RESET_ADMIN_ON_DEPLOY=true</b> (a ogni pubblicazione l'amministratore viene sospeso e, dalla schermata di accesso, "Reimposta amministratore" ne crea uno nuovo con lo stesso nome utente o un altro; utenti, servizi e presenze restano).</p>
<h4>Sviluppatore</h4>${pubBlock(1)}
<h4>Esportazioni</h4><p>Excel con riepilogo volontari (ore e km totali), dettaglio presenze con indirizzo di entrata e uscita e km, e servizi; PDF di firme e posizioni; CSV dello Storico azioni; backup JSON completo da Impostazioni.</p>

  for(const x of c)if(x.pos){pts.push([x.pos.lat,x.pos.lng]);L.circleMarker([x.pos.lat,x.pos.lng],{radius:8,color:'#c8102e',fillColor:'#c8102e',fillOpacity:.8}).bindTooltip(x.nome+' '+x.cognome,{permanent:true}).addTo(S.lg)}
  pts.length?S.lm.fitBounds(pts,{padding:[30,30],maxZoom:17}):S.lm.setView([45.5,9.2],8)}catch{const el=$('#mp');el&&(el.innerHTML='<p class="mu sm" style="padding:10px">Mappa non disponibile (serve la connessione): usa «Apri mappa».</p>')}}
function richEvento(){modal(`<h3>➕ Richiedi un nuovo evento</h3>${inp('qT','Manifestazione o evento','')}${inp('qL','Luogo (via e comune)','')}<div class="g2">${inp('qD','Data',ymd(Date.now()+7*864e5),'date')}${inp('qP','Volontari richiesti',4,'number','min="1"')}${inp('qI','Inizio','08:00','time')}${inp('qF','Fine','14:00','time')}</div>${ta('qN','Note per il gestore','')}<p class="mu sm">La richiesta arriva al gestore, che la approva o ti scrive il motivo del rifiuto.</p><div class="btns"><button class="btn sec" onclick="closeM()">Annulla</button><button class="btn" onclick="saveRich()">Invia richiesta</button></div>`,'serv')}
function saveRich(){const r={id:uid(),clienteId:SES.uid,titolo:val('qT'),luogo:val('qL'),data:$('#qD').value,oraInizio:$('#qI').value,oraFine:$('#qF').value,posti:Math.max(1,+$('#qP').value||1),note:val('qN'),stato:'attesa',creata:Date.now()};if(!r.titolo||!r.luogo||!r.data||!r.oraInizio||!r.oraFine)return toast('Compila evento, luogo, data e orari');put('richieste',r);logA('Richiesta di nuovo evento: '+r.titolo);closeM();toast('Richiesta inviata al gestore');render()}
function annRich(id){if(!confirm('Annullare la richiesta?'))return;put('richieste',{...DB.richieste[id],stato:'annullata'});render()}
function vRichCl(){const L=live('richieste').filter(r=>r.clienteId===SES.uid).sort((a,b)=>(b.creata||0)-(a.creata||0));
 $('#main').innerHTML=`<div class="row"><button class="btn" style="flex:1" onclick="richEvento()">➕ Richiedi un nuovo evento</button><button class="btn sec" onclick="clChat(SES.uid)">💬 Gestore</button></div><h4>Le tue richieste</h4>`+(L.map(r=>cardRq(r,0)).join('')||'<p class="mu sm">Nessuna richiesta.</p>')}
const cardRq=(r,ad)=>`<div class="card"><div class="ct"><b>${esc(r.titolo)}</b><span class="badge ${r.stato==='attesa'?'r':r.stato==='approvata'?'ok':''}">${ST_R[r.stato]||r.stato}</span></div><div class="mu sm">${ad?`👤 ${esc(nomeU(r.clienteId))}<br>`:''}📅 ${fmtD(r.data)}, ore ${r.oraInizio}–${r.oraFine}, ${r.posti} volontari<br>📍 ${esc(r.luogo)}</div>${r.note?`<p class="sm">${esc(r.note)}</p>`:''}${r.nota?`<p class="sm"><i>Risposta del gestore: ${esc(r.nota)}</i></p>`:''}${r.stato==='attesa'?`<div class="btns">${ad?`<button class="btn" onclick="rqOk('${r.id}')">Approva e crea il servizio</button><button class="btn sec" onclick="rqNo('${r.id}')">Rifiuta</button>`:`<button class="btn sec" onclick="annRich('${r.id}')">Annulla richiesta</button>`}</div>`:''}</div>`;
function vRichAd(){const L=live('richieste').sort((a,b)=>(b.creata||0)-(a.creata||0)),n=L.filter(r=>r.stato==='attesa').length;
 $('#main').innerHTML=`<div class="row">${back}</div><h4>Richieste di nuovi eventi (${n} in attesa)</h4>`+(L.map(r=>cardRq(r,1)).join('')||'<p class="mu sm">Nessuna richiesta.</p>')+`<h4>Chat con i clienti</h4>`+(clienti().map(u=>{const m=live('chat').filter(x=>x.cl===u.id).sort((a,b)=>b.ts-a.ts)[0];return`<div class="li"><span><b>${esc(nomeU(u.id))}</b><br><span class="mu sm">${m?esc(m.testo.slice(0,50))+' · '+fmtT(m.ts):'Nessun messaggio'}</span></span><button class="btn sm" onclick="clChat('${u.id}')">💬 Chat</button></div>`}).join('')||'<p class="mu sm">Nessun cliente: crea un utente con ruolo Cliente da Volontari.</p>')}
function rqOk(id){const r=DB.richieste[id];S.rq=id;editServ(null,{titolo:r.titolo,luogo:r.luogo,data:r.data,oraInizio:r.oraInizio,oraFine:r.oraFine,posti:r.posti,note:r.note,clienteId:r.clienteId});S.rq=id}
function rqNo(id){const n=prompt('Motivo del rifiuto (facoltativo, il cliente lo leggerà)');if(n===null)return;put('richieste',{...DB.richieste[id],stato:'rifiutata',nota:n});logA('Richiesta evento rifiutata');render()}
function clChat(cl){S.chat={cl,sent:0};const adm=role()==='admin';modal(`<h3>💬 ${adm?esc(nomeU(cl)):'Chat con il gestore'}</h3><p class="mu sm">${adm?'Conversazione con il cliente.':'Scrivi al gestore: ti risponde appena può. La chat è sempre attiva.'}</p><div id="cm" class="chat"></div><div class="row" style="margin:8px 0 0"><input id="cT" placeholder="Scrivi un messaggio" maxlength="500" autocomplete="off"><button class="btn" id="cS">Invia</button></div><div class="btns"><button class="btn sec" onclick="closeM()">Chiudi</button></div>`,'chat');chatRefresh();$('#cm').scrollTop=1e9;$('#cS').onclick=clSend;$('#cT').onkeydown=e=>{if(e.key==='Enter')clSend()}}
function clSend(){const i=$('#cT'),t=i.value.trim();if(!t||!S.chat?.cl)return;put('chat',{id:uid(),cl:S.chat.cl,utenteId:SES.uid,nome:nomeU(SES.uid),testo:t.slice(0,500),ts:Date.now()});i.value='';chatRefresh();$('#cm').scrollTop=1e9;toast('Messaggio in coda: parte entro 30 secondi')}
async function gpsRispondi(){if(role()!=='tecnico'||S.gpsB||!me()?.gpsCliente)return;const a=LS.g('vp_gpsans',{});
 for(const g of live('gps')){const p=DB.presenze[g.servizioId+'_'+SES.uid];if(!p?.checkIn||p.checkOut||Date.now()-g.ts>6e5||a[g.id])continue;a[g.id]=1;LS.s('vp_gpsans',Object.fromEntries(Object.entries(a).slice(-30)));S.gpsB=1;const pos=await gps();S.gpsB=0;
  if(pos.lat!=null){put('posizioni',{id:g.servizioId+'_'+SES.uid,servizioId:g.servizioId,utenteId:SES.uid,lat:pos.lat,lng:pos.lng,acc:pos.acc,ts:Date.now()});logA('Posizione condivisa con il cliente: '+(DB.servizi[g.servizioId]?.titolo||''),'permesso','concesso');schedSync()}else logA('Posizione richiesta dal cliente non rilevata','permesso','non rilevata')}}
function setGpsCl(on){put('utenti',{...me(),gpsCliente:on});logA('Consenso alla verifica della posizione da parte del cliente: '+(on?'attivato':'disattivato'),'permesso',on?'concesso':'revocato');toast(on?'Consenso attivato: il cliente potrà richiedere la tua posizione durante il servizio':'Consenso disattivato');render()}
const VIEWS={richieste:()=>isCl()?vRichCl():vRichAd(),ricorr:vRicorr,archivio:vArch,cestino:vCestino,servizi:vServizi,turno:vTurno,stats:vStats,volontari:vVol,altro:vAltro,storico:vLog,promemoria:vProm,impostazioni:vImp};
/* ============ AVVIO ============ */
async function boot(){if(SES&&DB.utenti[SES.uid]){startApp();return sync()}
 let st=null;try{st=await api({action:'status'})}catch{}S.needAdmin=!!st?.needAdmin;
 if(st?.setup&&LS.g('vp_last',0))return resetLocale();
 st?.setup||(!st&&!Object.keys(CREDS).length)?authView('setup',!!st):authView('login')}
document.documentElement.dataset.theme=theme();
addEventListener('pointerdown',()=>{const n=Date.now();S.idle=n-S.lastAct;S.lastAct=n},true);
addEventListener('online',()=>{toast('Connessione ripristinata: invio dei dati in coda');sync()});addEventListener('offline',()=>{S.online=false;dot()});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.bip=e});
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.prom)apriProm(e.data.prom);if(e.data?.go)go(e.data.go)});const q=new URLSearchParams(location.search).get('prom');if(q){S.pend=q;history.replaceState(null,'',location.pathname)}const g=new URLSearchParams(location.search).get('go');if(['turno','servizi','richieste'].includes(g)){S.pendGo=g;history.replaceState(null,'',location.pathname)}}
boot();
</script>
