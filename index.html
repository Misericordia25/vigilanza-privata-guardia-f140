<style>

canvas.ch{width:100%;height:220px;display:block}

#nav button.rd{color:#fff;background:var(--r);animation:rd 1.6s infinite}#nav button.bl{color:#fff;background:#1565c0;animation:rd 1.6s infinite}.btn.yl{background:#f2c200;color:#1d2125}.btn.sos{background:#b00020;font-size:17px;padding:14px;letter-spacing:.5px}.lk{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.lk b.on{color:var(--ok)}.lk b.off{color:var(--mu)}#emg{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:20px;color:#fff;text-align:center;background:#b00020;overflow:auto}#emg.fl{animation:emf .5s steps(1) infinite}@keyframes emf{50%{background:#fff;color:#b00020}}#emg .btn{font-size:18px;padding:16px}#emg h2{font-size:28px;margin:0}.tp{border:2px solid var(--tc);border-left-width:8px}.tpn{color:var(--tc);font-weight:700;font-size:13px}.btn.tc{background:var(--tc)}.btn.tc.sec{background:transparent;color:var(--tx);border:2px solid var(--tc)}.fl{background:var(--card);border:2px solid var(--tc,var(--ln));color:var(--tx);border-radius:10px;min-width:44px;padding:8px;font:inherit;cursor:pointer}.fl.on{background:var(--tc,var(--g));color:#fff}#vas{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:6;background:#e0a800;color:#1d2125;border-radius:12px;padding:8px 10px;display:none;gap:8px;align-items:center;font-size:13px;box-shadow:0 4px 16px #0005}#vas.on{display:flex}#vas span{flex:1}body.vas header{border-bottom-color:#e0a800}#pvg{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:12px}#pvt{max-height:46vh;overflow:auto;border:1px solid var(--ln);border-radius:10px;padding:10px;background:var(--card);margin:8px 0}#pvt h5{margin:10px 0 4px}#pvt p,#pvt li{font-size:13.5px}@keyframes rd{50%{opacity:.7}}@media(prefers-reduced-motion:reduce){#nav button.rd,#nav button.bl{animation:none}}
#vo .pulse{width:14px;height:14px;border-radius:50%;background:var(--r);animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){#vo .pulse{animation:none}#toast{transition:none}}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}.tile>b{font-size:22px;width:30px;text-align:center}
.info p,.info li{font-size:14px}.info ul{padding-left:18px}
#bc{font-style:normal;background:var(--r);border-radius:10px;padding:0 5px;font-size:11px;margin-left:2px}#bc:empty{display:none}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:8px 0}.chk input{width:auto;margin:0}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
a{color:var(--r)}
/* feedback al tocco: ogni pulsante cambia colore alla pressione */
.btn,.hb,nav button,.tile,.seg button{transition:background-color .1s,filter .1s,transform .1s,color .1s}
.btn:active,.btn.prs{filter:brightness(.7);transform:scale(.96)}.btn.sec:active,.btn.sec.prs{background:var(--ln);filter:none}
.hb:active,.hb.prs{background:#ffffff4d}nav button:active,nav button.prs{background:#c8102e29;color:var(--r)}
.tile:active,.tile.prs{background:var(--ln)}.seg button:active,.seg button.prs{background:var(--r);color:#fff}
.ic{display:inline-block;margin-right:5px}.mic .btn{white-space:nowrap}a.btn{display:block;text-align:center;text-decoration:none}
.chat{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}.msg{max-width:84%;padding:7px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);font-size:14px}
.msg.me{align-self:flex-end;background:#c8102e17;border-color:#c8102e55}.msg small{display:block;color:var(--mu);font-size:11px}
.bar{height:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%}
#bgl{position:fixed;inset:0;z-index:4;pointer-events:none;background:center/min(70vw,70vh) no-repeat;opacity:.09}
#gd{position:fixed;left:8px;right:8px;top:calc(64px + env(safe-area-inset-top));z-index:30;background:var(--g);color:#fff;border-radius:12px;padding:10px 12px;display:none;gap:10px;align-items:center;box-shadow:0 6px 24px #0006;font-size:14px;max-width:560px;margin:auto}
#gd.on{display:flex}#gd span{flex:1}#gd .btn{background:#fff;color:#1d2125;white-space:nowrap}
.fgrande{width:100%;max-width:300px;background:#fff;border:1px solid var(--ln);border-radius:6px;display:block;margin-top:6px}
</style></head>
<body>
<div id="bgl"></div><div id="gd" role="status" aria-live="polite"><span id="gT"></span><button class="btn sm" onclick="salta()">Salta guida ⏭</button></div>
<div id="auth"></div>
<div id="shell" hidden>
<header><img id="hLogo" alt="Logo"><h1><span id="hAz">Carlo Doga</span><small id="hUser"></small></h1>
<span id="dot" onclick="toast(this.title)" title=""></span>
<button class="hb" id="hVoce" onclick="setVoce(!voceOn())" aria-label="Voce guida"><b id="hVi">🔊</b>Voce</button>
<button class="hb" onclick="go('promemoria')" aria-label="Avvisi"><b>🔔</b>Avvisi<i id="bc"></i></button>
<button class="hb" onclick="info()" aria-label="Informazioni"><b>ⓘ</b>Info</button>
<button class="hb" onclick="logout()"><b>⏻</b>Esci</button></header>
<main id="main"></main><div id="vas"><span id="vasT"></span><button class="btn sm" style="background:#1d2125" onclick="tornaAdmin()">↩ Torna amministratore</button></div><nav id="nav"></nav></div>
<div id="modal"></div><div id="toast"></div>
<script>
/* ============ COSTANTI E STATO ============ */
const VER='2.0.0',RET=180,API='/.netlify/functions/sync'; // RET = giorni di conservazione di firme e posizioni GPS
const COLS=['utenti','servizi','risposte','presenze','promemoria','log','impostazioni','chat','privacy','squadra','richieste','gps','posizioni','equipaggio','emergenze','emgpos'];
const RUOLI={admin:'Amministratore',tecnico:'Volontario',lettura:'Sola lettura (gratuito, max 5)',cliente:'Cliente (richiedente degli eventi)',prog:'Programmatore'};
const RISERV={volontari:'Gestione volontari',export:'Esportazioni Excel e CSV',storico:'Storico azioni',backup:'Backup e ripristino',sicurezza:'Dati azienda e sicurezza'};
const LOGO='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 4 8 13v17c0 15 10 26 24 30 14-4 24-15 24-30V13z" fill="#3a3f45"/><path d="M32 10 14 17v13c0 11 7 20 18 24 11-4 18-13 18-24V17z" fill="#c8102e"/><path d="m22 32 7 7 14-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('Memoria del dispositivo piena: esporta un backup')}}};
let DB=LS.g('vp_db',{});COLS.forEach(c=>DB[c]??={});
let Q=LS.g('vp_queue',[]),CREDS=LS.g('vp_creds',{}),SES=LS.g('vp_session',null),SEQ=LS.g('vp_seq',0);
const S={view:'servizi',online:null,syncing:false,pinOk:false,lastAct:Date.now(),idle:0,period:90,alerts:[],usage:LS.g('vp_uso',null)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const me=()=>SES&&DB.utenti[SES.uid],role=()=>{const r=me()?.ruolo||'lettura';return r==='prog'?'admin':r},isProg=()=>!S.as&&me()?.ruolo==='prog'; // il programmatore ha i permessi dell'amministratore
/* Funzioni a pagamento: le decide il server (licenza applicata dal programmatore); qui servono solo per mostrare o nascondere */
let LIC=LS.g('vp_lic',null);const lic=k=>!!LIC?.on?.[k],LIM=()=>LIC?.lim||{adm:2,vol:15,let:5,cli:0},isMaster=id=>!!LIC?.master&&LIC.master===id;
const cfg=()=>DB.impostazioni.cfg||{id:'cfg',azienda:'Carlo Doga',riservate:[],timeout:5};
const live=c=>Object.values(DB[c]).filter(r=>!r.deleted&&!(c==='presenze'&&r.escluso)&&!(c==='utenti'&&r.ruolo==='prog')); // il programmatore non compare negli elenchi
const nomeU=id=>{const u=DB.utenti[id];return u?(u.nome+' '+u.cognome).trim():id&&id===LIC?.pid?'Programmatore':'Utente'};
const saveDB=()=>LS.s('vp_db',DB);
/* ============ DATE ============ */
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
const fmtT=t=>new Date(t).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'});
const hm=t=>new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const byDate=(a,b)=>(a.data+a.oraInizio).localeCompare(b.data+b.oraInizio);
const dur=s=>{const m=x=>{const[h,mm]=x.split(':');return h*60+ +mm};let d=m(s.oraFine)-m(s.oraInizio);if(d<=0)d+=1440;return Math.round(d/15)/4};
const inPer=d=>S.period==='all'||new Date(d+'T12:00')>=Date.now()-S.period*864e5;
const statoP=p=>p?.stato||(p?.checkOut?'presente':p?.checkIn?'in servizio':'');
// Ore di volontariato complessive di un utente (tutte le presenze confermate, senza limite di periodo)
const TRAG=30;
const oreU=id=>Math.round(live('presenze').filter(p=>p.utenteId===id&&['presente','in servizio'].includes(statoP(p))&&DB.servizi[p.servizioId]&&!DB.servizi[p.servizioId].deleted).reduce((a,p)=>a+(+p.ore||0),0)*100)/100;
// Stendardo di ringraziamento al raggiungimento di 30 ore; altrimenti barra di avanzamento
function stendardo(id,mio){const o=oreU(id),n=nomeU(id);
 if(o>=TRAG)return`<div class="card" style="background:linear-gradient(135deg,var(--g),var(--r));color:#fff;text-align:center;border:0"><div style="font-size:30px">🏅</div><b style="font-size:17px">${mio?'Grazie':'Grazie a '+esc(n)}!</b><p style="margin:4px 0">${mio?'Hai':'Ha'} raggiunto <b>${o} ore</b> di volontariato.<br>Il tuo tempo rende più sicura la nostra comunità.</p></div>`;
 return mio?`<div class="card"><div class="ct"><b>Le mie ore di volontariato</b><span>${o} / ${TRAG} h</span></div><div style="height:8px;background:var(--bg);border-radius:6px;margin-top:8px;overflow:hidden"><div style="height:100%;width:${Math.round(o/TRAG*100)}%;background:var(--r)"></div></div><p class="mu sm">Mancano ${Math.round((TRAG-o)*100)/100} ore al traguardo di ${TRAG}: ti aspetta un ringraziamento speciale.</p></div>`:''}
/* ============ UI BASE ============ */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3400)}
function modal(h,g){if(g)parla(GMOD[g]);$('#modal').innerHTML=`<div class="mbox" role="dialog">${h}</div>`;$('#modal').classList.add('on')}
function closeM(){S.chat=null;$('#modal').classList.remove('on');$('#modal').innerHTML=''}
const inp=(id,l,v='',t='text',x='')=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}" ${x}></label>`;
const ta=(id,l,v='')=>`<label>${l}<span class="mic"><textarea id="${id}" rows="3">${esc(v)}</textarea><button type="button" class="btn sec sm" onclick="mic('${id}')" aria-label="Detta">🎤 Detta</button></span></label>`;
const val=id=>$('#'+id).value.trim();
const seg=(k,opts,cur)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${cur==v?'on':''}" onclick="S.${k}=${typeof v==='number'?v:`'${v}'`};render()">${l}</button>`).join('')}</div>`;
function download(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
const theme=()=>LS.g('vp_theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function setTheme(t){LS.s('vp_theme',t);document.documentElement.dataset.theme=t;render()}
/* ============ CRITTOGRAFIA (PBKDF2-SHA-256, Web Crypto) ============ */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbk(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(salt),iterations:100000,hash:'SHA-256'},k,256))}
async function mkPw(pass){const salt=hex(crypto.getRandomValues(new Uint8Array(16)));return{salt,hash:await pbk(pass,salt)}}
/* ============ DATI, CODA, REGISTRO ============ */
// Salva un record in locale e lo mette in coda per il cloud (una sola voce per record)

const PRIVTXT=["#1. Titolare del trattamento", "Titolare del trattamento è {azienda}. I recapiti per esercitare i tuoi diritti ti sono comunicati dal coordinatore.", "#2. Quali dati trattiamo", "• Dati anagrafici e di contatto: nome, cognome, numero di cellulare, indirizzo email.", "• Indirizzo di residenza (via, numero civico, CAP, città) e le coordinate geografiche ricavate da esso, usate solo per stimare la distanza tra casa e luogo del servizio.", "• Dati di accesso: nome utente e password (conservata solo in forma di impronta cifrata, non leggibile da nessuno), ruolo.", "• Dati sull'attività di volontariato: risposte di disponibilità alle richieste di servizio (con data e ora), presenze, orari di entrata e uscita, ore svolte, note.", "• Messaggi della chat dell'evento, scambiati tra i volontari che hanno accettato il servizio e il coordinatore, e messaggi della chat dei promemoria, scambiati con il coordinatore o con gli altri destinatari del promemoria (se il coordinatore ha attivato la chat).", "• Dati tecnici per le notifiche push: identificativo anonimo del dispositivo assegnato dal browser, usato solo per inviare i promemoria all'ora stabilita, anche ad app chiusa (solo se consenti le notifiche).", "• Firma apposta sullo schermo a fine servizio, solo se il coordinatore ha scelto di richiederla.", "• Conferma dell'informativa privacy: data e ora della conferma, scadenza (365 giorni), versione dell'app e, se il coordinatore lo richiede, la firma apposta sullo schermo; sono registrati anche l'eventuale rimozione della spunta e da chi è stata fatta.", "• Assegnazione alle squadre: il servizio (Antincendio o Safety) a cui il coordinatore ti assegna tra i volontari candidati; nome e numero di cellulare sono visibili ai soli volontari della tua stessa squadra, per coordinarvi durante il servizio.", "• Dati condivisi con il cliente dell'evento (se attiva la figura Cliente): se il tuo servizio ha un cliente (la persona o l'ente che ha richiesto l'evento), dal momen a in carico della chiamata e per i 10 minuti successivi. Funziona solo con l'app aperta e con il permesso di posizione del telefono. Sono registrati anche chi ha attivato, preso in carico o annullato la chiamata, con data e ora.", "• Registro delle azioni: accessi, operazioni eseguite e richieste di permessi del dispositivo (posizione, microfono, notifiche).", "L'app non richiede né ha lo scopo di raccogliere categorie particolari di dati (art. 9 GDPR, ad esempio dati sulla salute). Ti chiediamo di non inserirli nei campi note e nella chat.", "#3. Finalità e basi giuridiche", "• Organizzare i servizi, raccogliere le disponibilità e registrare presenze e ore dei volontari (gestione del rapporto di volontariato, art. 6.1.b e 6.1.f GDPR).", "• Documentare l'effettiva presenza sul luogo del servizio mediante indirizzo rilevato a inizio e fine turno ed, eventualmente, firma (consenso, art. 6.1.a GDPR, espresso nel modulo allegato).", "• Stimare la distanza da casa al luogo di ritrovo e al luogo del servizio, calcolare i chilometri percorsi per le statistiche e agevolare il raggiungimento con il navigatore (art. 6.1.b e 6.1.f).", "• Inviare promemoria e notifiche all'ora stabilita e consentire una risposta tramite la chat del promemoria (art. 6.1.b e 6.1.f; notifiche sul dispositivo con il tuo consenso).", "• Consentire la comunicazione tra i partecipanti a un servizio tramite la chat dell'evento (art. 6.1.b e 6.1.f).", "• Elaborare statistiche interne su presenze e ore e riconoscere il contributo dei volontari (legittimo interesse, art. 6.1.f).", "• Formare le squadre di servizio tra i volontari candidati e consentire ai componenti della stessa squadra di contattarsi e comunicare tra loro (art. 6.1.b e 6.1.f).", "• Consentire al cliente che ha richiesto l'evento di sapere chi è in servizio tra i volontari assegnati al suo servizio, di contattarli e, solo con il tuo consenso facoltativo, di verificarne la presenza con la posizione (consenso, art. 6.1.a GDPR; per nome e cellulare, legittimo interesse e rapporto di volontariato, art. 6.1.b e 6.1.f).", "• Documentare la lettura e l'accettazione di questa informativa, con conferma annuale ed eventuale firma (art. 6.1.a e obbligo di dimostrare il consenso, art. 7.1 GDPR).", "• Tutelare l'incolumità dei volontari durante il servizio con la chiamata d'emergenza e la localizzazione dei volontari in campo (protezione degli interessi vitali dell'interessato o di altre persone, art. 6.1.d GDPR, e legittimo interesse alla sicurezza dei volontari, art. 6.1.f).", "• Adempiere a obblighi di legge e tutelare i diritti del Titolare, ove necessario.", "#4. Per quanto tempo conserviamo i dati", "Firma e indirizzi di entrata e uscita: 180 giorni dal servizio, poi cancellazione automatica dall'app e dal cloud.", "Conferma e firma dell'informativa privacy: Validità 365 giorni, poi riconferma. La firma archiviata resta per la durata del rapporto di volontariato e poi viene cancellata con l'account (Cestino: 180 giorni).", "Posizione condivisa con il cliente (coordinate): Circa 3 ore dopo la fine dell'evento, poi cancellazione automatica.", "Posizione inviata per una chiamata d'emergenza (coordinate): Al massimo un'ora, poi cancellazione automatica; registro della chiamata (chi, quando, servizio): 180 giorni.", "Chat cliente-gestore: 90 giorni dall'ultimo messaggio.", "Messaggi della chat dell'evento: 48 ore dopo la fine dell'evento, poi cancellazione automatica.", "Messaggi della chat dei promemoria: 7 giorni dopo la data del promemoria.", "Elementi eliminati dal gestore (Cestino): 180 giorni nel Cestino, poi eliminazione definitiva.", "#5. Chi può vedere i dati e dove sono archiviati", "• Persone autorizzate del Titolare: i coordinatori che gestiscono i servizi. Ogni volontario vede soltanto i propri dati; la chat di un evento o di un promemoria è visibile solo ai partecipanti e al coordinatore. I componenti della stessa squadra vedono reciprocamente nome e cellulare, e solo dopo che il coordinatore ha comunicato la formazione delle squadre; i volontari non conoscono il numero di persone richieste per i servizi.", "• Cliente che ha richiesto l'evento (se attiva la figura Cliente): vede nome, cognome e cellulare dei soli volontari assegnati al proprio servizio e in servizio dal Check-in, e la posizione solo dei volontari che l'hanno consentita; il cliente è invitato a usare questi dati solo per l'evento e a non diffonderli.", "• Servizio mappa (OpenStreetMap): per mostrare la mappa al cliente, il suo dispositivo richiede le immagini della mappa a OpenStreetMap, che riceve l'indirizzo IP e l'area visualizzata, non il nome dei volontari.", "• Fornitore del servizio cloud (hosting e archiviazione dei dati dell'app), nominato responsabile del trattamento ai sensi dell'art. 28 GDPR. Eventuali trasferimenti fuori dallo Spazio economico europeo avvengono con le garanzie previste dagli artt. 44 e seguenti GDPR.", "• Servizio di ricerca degli indirizzi (OpenStreetMap, Nominatim): per ottenere le coordinate, il testo dell'indirizzo (via, civico, CAP, città) viene inviato a questo servizio pubblico, senza nome e cognome della persona. Al Check-in e al Check-out lo stesso servizio riceve le coordinate del dispositivo per restituire l'indirizzo. Vale per l'indirizzo di casa, della sede e dei luoghi dei servizi.", "• Servizio di calcolo dei percorsi (OSRM): per i chilometri su strada, le coordinate di partenza e arrivo vengono inviate a questo servizio pubblico, senza nome e cognome; in caso di indisponibilità l'app usa una stima.", "• Servizi di notifica del sistema (Apple, Google, Mozilla o altri del browser): il testo del promemoria transita cifrato attraverso questi servizi per arrivare al dispositivo.", "• Applicazioni di navigazione (Google Maps o Apple Mappe): se scegli \"Sede di Ritrovo\" o \"Luogo del Servizio\", il tuo dispositivo apre l'applicazione di mappe del sistema con la destinazione; da quel momento valgono le informative del relativo fornitore.", "• Dettatura e nfermando l'informativa. Anche il coordinatore può togliere la spunta. Hai inoltre diritto di proporre reclamo al Garante per la protezione dei dati personali (www.garanteprivacy.it).", "#8. Natura del conferimento", "Il conferimento dei dati anagrafici, di contatto e dell'indirizzo di casa è necessario per partecipare ai servizi tramite l'app; l'indirizzo serve soltanto alla stima della distanza. Il consenso a posizione e firma è libero: se non lo presti, la tua presenza potrà essere confermata dal coordinatore senza indirizzo, km e firma digitale. Se il coordinatore disattiva la firma, questa non viene raccolta."];

function info(){const L=SES?LIM():null,F=k=>SES?(lic(k)?' <span class="badge ok">🔓€ attiva</span>':' <span class="badge">🔒€ a richiesta</span>'):' <span class="badge">€ opzione</span>';modal(`<div class="info"><h3>ⓘ ${esc(cfg().azienda||'Carlo Doga')}</h3><p class="mu sm">Carlo Doga, versione ${VER}</p>
<p>L'app gestisce le <b>richieste di servizio</b> ai volontari, raccoglie le <b>disponibilità</b> e registra le <b>presenze reali</b> con check-in e check-out. Il coordinatore vede chi ha dato servizio, dove, quando e per quante ore; ogni volontario ha lo storico delle proprie disponibilità e dei servizi svolti. Il nome che vedi in alto lo sceglie l'amministratore in Impostazioni (predefinito «Carlo Doga»).</p>
<h4>Schermate</h4><ul>
<li><b>Servizi</b>: il coordinatore crea le richieste (evento, luogo, data, orario, volontari necessari che solo lui vede) di tipo <b>Servizio Antincendio</b> (riquadro e pulsanti <b>rossi</b>) o <b>Servizio Safety</b> (riquadro e pulsanti <b>blu</b>), oppure entrambe per lo stesso evento. Il volontario risponde <b>Mi candido</b> (a una sola delle due) o <b>Non disponibile</b>, anche a voce con 🎤: i pulsanti si colorano <b>solo dopo la scelta</b>. Il Dettaglio volontari mostra chi si è candidato, chi ha rifiutato e chi non ha risposto, conferma le presenze e apre <b>Firme e posizioni</b>.</li>
<li><b>Turno</b>: nel giorno del servizio il volontario <b>assegnato</b> fa check-in (si attiva 30 minuti prima) e check-out; il pulsante Turno ha il colore della tipologia. Al check-in e al check-out l'app salva l'<b>indirizzo</b> (non le coordinate) e i <b>km</b>; sotto trovi la tua squadra con i telefoni, il tuo storico e le ore (al traguardo delle 30 ore lo stendardo 🏅).</li>
<li><b>Statistiche</b>: riquadri riepilogativi, <b>elenco degli eventi con nome e luogo</b>, ore per volontario, presenze e assenze, tabella di affidabilità, Archivio firme per evento e Calendario ricorrenze. L'<b>Excel</b> ha un foglio <b>Riepilogo</b> uguale alla schermata dello smartphone (riquadri, eventi con nome e luogo, affidabilità con <b>cellulare ed email</b>), più i fogli di dettaglio.</li>
<li><b>Volontari</b> (amministratore): anagrafica, ruolo, password, sospensione, eliminazione nel Cestino, informativa privacy, visualizzatore «vedi l'app come questo volontario».</li>
<li><b>Altro</b>: Promemoria, Richieste dei clienti, Storico azioni, Cestino, Manuali, Impostazioni, Informazioni.</li></ul>
<h4>Ruoli</h4><ul><li><b>Amministratore</b>: tutte le funzioni. Il primo, che fa la prima configurazione, è l'<b>amministratore master</b> 👑: gli altri amministratori non possono toglierlo, sospenderlo, modificarlo o eliminarlo. Amministratori: 2${F('adm').replace('a richiesta','fino a 4 a richiesta')}${L?' (ora '+L.adm+')':''}.</li><li><b>Volontario</b>: risponde alle richieste, fa check-in e check-out, vede solo i propri dati. Fino a 15 volontari, oltre fino a 50${F('vol')}${L?' (ora '+L.vol+')':''}.</li><li><b>Sola lettura</b>: consulta servizi, statistiche e storico; gratuiti, massimo 5.</li><li><b>Cliente</b>${F('cliente')}: chi richiede l'evento; vede solo i propri eventi e, dal check-in, i volontari del suo servizio. 25 clienti inclusi, oltre a blocchi di 10 fino a 200.</li><li><b>Programmatore</b>: si registra per primo sul sito nuovo con il codice di attivazione (pulsante <b>🛠 Accesso programmatore</b> nella schermata di accesso), ha gli stessi permessi dell'amministratore, non compare negli elenchi, attiva le funzioni a pagamento con il pulsante giallo <b>Applica</b> e può cambiare l'amministratore master. Non fa la prima configurazione: quella spetta al primo amministratore.</li></ul>
<h4>Funzioni a pagamento</h4><p>In <b>Impostazioni › Funzioni e licenza</b> l'amministratore vede quali sono attive (🔓€) e quali vanno richieste (🔒€); con <b>Richiedi</b> si apre WhatsApp con il messaggio già scritto per il programmatore. Le funzioni acquistate non scadono; il programmatore può anche attivarle in prova fino a una data. Il blocco è imposto dal server; se una funzione viene disattivata i dati restano, si blocca solo l'uso.</p><ul>
<li>Firma sullo schermo per l'informativa privacy${F('firmaPriv')}</li><li>Chat degli eventi e dei promemoria${F('chat')}</li><li>Firma a fine turno (check-out)${F('firmaFine')}</li><li>Richiesta firma al check-out sul singolo servizio${F('firmaServ')}: anche con la firma spenta nelle Impostazioni, una spunta nella scheda del servizio la richiede solo lì</li><li>Amministratori oltre 2 (fino a 4) e volontari oltre 15 (fino a 50)</li><li>Figura Cliente e clienti oltre 25</li><li>Pulsante emergenza${F('emerg')} ed emergenza estesa al cliente${F('emergCl')}</li><li>Stampa delle tabelle Excel e delle firme in PDF${F('stampe')}</li></ul>
<h4>Firma al check-out</h4><p>Se attiva, a fine turno il volontario firma sullo schermo. In Dettaglio volontari, Firme e posizioni, PDF ed Excel vedi sempre <b>chi ha chiuso il turno</b>: ✍️ firmato dal volontario, 👤 chiuso dal volontario senza firma, 🤖 <b>chiuso dall'app</b> perché il volontario ha dimenticato il check-out (2 ore dopo la fine, all'ora di fine evento; gli amministratori ricevono un avviso e possono correggere l'orario).</p>
<h4>🆘 Pulsante emergenza</h4><p>Durante un servizio lo può premere chiunque sia coinvolto: un volontario in campo (dopo il check-in), l'amministratore e, con l'opzione estesa, il cliente del servizio. Arriva subito la <b>notifica</b> a tutti i volontari in campo e agli amministratori (e al cliente): «tra 15 secondi sarete geolocalizzati». Sui telefoni con l'app aperta parte l'<b>allarme</b> (suono, vibrazione, schermo lampeggiante e flash) finché un altro volontario in campo o un amministratore preme <b>Presa in carico Chiamata d'Emergenza</b>: l'app torna normale e chi l'ha presa in carico vede i pulsanti per <b>telefonare</b> ai volontari con check-in. Dopo i 15 secondi i volontari in servizio vengono <b>geolocalizzati anche senza consenso privacy</b>; la posizione la vedono solo l'amministratore e, con l'opzione estesa, il cliente, e resta attiva fino alla presa in carico e per 10 minuti dopo. Chi ha premuto può <b>annullare</b> un falso allarme.</p><p class="mu sm"><b>Limiti tecnici</b>: è un aiuto organizzativo e non sostituisce il 112. Allarme continuo, flash e invio della posizione funzionano solo con l'<b>app aperta</b>; con il telefono bloccato o l'app chiusa arriva solo la notifica con il suono di sistema. Vibrazione e flash non esistono su iPhone per le web app; il flash su Android chiede il permesso della fotocamera. La posizione richiede il permesso GPS del telefono. La consegna delle notifiche dipende da rete, telefono e permessi. Prova l'allarme da Impostazioni.</p>
<h4>Tipologie e squadre</h4><p>Per lo stesso evento il coordinatore può creare le due richieste Antincendio e Safety, con un numero di volontari diverso (i volontari non sanno mai quanti ne servono). I volontari si candidano a una sola; da <b>📣 Squadre</b> il coordinatore assegna ciascuno con un flag e preme il pulsante verde <b>Comunica</b>: arrivano le notifiche, compaiono il Turno e i telefoni della propria squadra. Il check-in è possibile solo per chi è assegnato.</p>
<h4>Privacy</h4><p>Al primo accesso e ogni <b>365 giorni</b> il volontario legge l'informativa (scorrendola o a voce) e conferma con la spunta e, se attiva, la firma. Chi toglie la spunta, volontario o gestore, sospende l'account e arriva una notifica a entrambi. Avviso 15 giorni prima della scadenza.</p>
<h4>Sincronizzazione e lavoro offline</h4><p>Ogni operazione si salva subito sul dispositivo e parte verso il cloud. Per non consumare crediti l'app <b>non controlla più il server ogni 30 secondi</b>: si aggiorna quando la apri, quando torna in primo piano, dopo ogni tua azione e quando arriva una notifica push. Solo mentre una chat o una mappa sono aperte si aggiorna ogni 30 secondi, e durante un'emergenza ogni 8 secondi. Senza rete i dati restano in coda. Il pallino in alto: verde sincronizzato, rosso offline, giallo in corso, grigio solo locale.</p>
<h4>Notifiche e promemoria</h4><p>Notifiche push anche ad app chiusa (serve il permesso; su iPhone l'app va aggiunta alla schermata Home, iOS 16.4 o successivo): nuovi servizi, squadre, privacy, emergenze, promemoria e avvisi di turno. I promemoria e gli avvisi di turno ad app chiusa arrivano <b>entro 15 minuti</b> dall'ora prevista (controllo del server ogni 15 minuti); con l'app aperta all'ora esatta. Toccando un promemoria si apre la sua chat.</p>
<h4>Crediti del server</h4><p>Solo l'amministratore vede in Impostazioni i crediti Netlify del mese: l'app conta <b>tutte</b> le chiamate di tutte le figure (programmatore compreso), l'apertura dell'app, la funzione pianificata e le <b>pubblicazioni</b> (ogni deploy costa 15 crediti), con il dettaglio per figura. Si aggiorna ogni 6 ore (o con «Aggiorna ora»). È un conteggio molto vicino al reale; il valore ufficiale è nel pannello Netlify e si può usare per <b>tarare</b> il contatore. Avvisi a 100, 200 e 250 crediti; a 300 il piano gratuito mette il sito in pausa.</p>
<h4>Cliente</h4><p>Il cliente vede i propri eventi, dal check-in nomi e telefoni dei volontari del suo servizio (può chiamarli), la verifica della posizione dei volontari che l'hanno consentita, la chat con i volontari e con il gestore, e può richiedere nuovi eventi che il gestore approva o rifiuta.</p>
<h4>Altre funzioni</h4><ul><li><b>Distanza e navigatore</b>: stima da casa, km su strada al check-in e check-out, apertura del navigatore verso ritrovo e luogo.</li><li><b>Chat dell'evento</b>${F('chat')}: tra chi è assegnato e il gestore; si azzera 48 ore dopo la fine.</li><li><b>Voce guida</b>, dettatura e risposte a voce; tema chiaro o scuro; logo di sfondo.</li><li><b>Servizi passati</b>: 6 ore dopo la fine non sono più modificabili. <b>Cestino</b>: 180 giorni.</li><li><b>Sicurezza</b>: password cifrate (PBKDF2), PIN sulle funzioni riservate, dati nel cloud cifrati con DATA_KEY, firme e indirizzi cancellati dopo 180 giorni.</li><li><b>Esportazioni</b>${F('stampe')}: Excel, PDF di firme e posizioni, Excel delle ricorrenze; CSV dello storico e backup JSON (sempre disponibili).</li><li><b>Backup</b>: esporta e importa il JSON per spostare i dati su un nuovo sito (stesse variabili DATA_KEY).</li><li><b>Manuali</b> in Altro › Manuali, da leggere, ascoltare o scaricare.</li></ul>
<h4>Prove e azzeramento</h4><p>Impostazioni › Azzera tutti i dati nel cloud riparte dalla prima configurazione (restano il programmatore, la licenza e il conteggio dei crediti). Ogni pubblicazione su Netlify costa 15 crediti: durante le prove pubblica il meno possibile.</p>

function emgOk(sid){closeM();if(!navigator.onLine)return toast('Sei offline: la chiamata partirà appena torna la rete. Chiama il 112 se serve.');put('emergenze',{id:uid(),servizioId:sid,da:SES.uid,daNome:nomeU(SES.uid),ts:Date.now(),stato:'attiva'});logA('🆘 Chiamata d\'emergenza attivata: '+DB.servizi[sid].titolo,'azione','ok');clearTimeout(syncT);sync();emgCheck();toast('Chiamata d\'emergenza inviata')}

// chiamate d'emergenza che fanno suonare il mio telefono (non quelle attivate da me)
const emgMie=()=>SES&&!S.as?live('emergenze').filter(e=>e.stato==='attiva'&&e.da!==SES.uid&&(role()==='admin'?!isProg():role()==='tecnico'?inCampo(e.servizioId):role()==='cliente')):[];

const emgGpsOn=()=>SES&&!S.as&&role()==='tecnico'?[...new Set(live('emergenze').filter(e=>inCampo(e.servizioId)&&Date.now()>=e.ts+EMG_AV&&(e.stato==='attiva'||e.stato==='presa'&&Date.now()<(e.gpsFino||0))).map(e=>e.servizioId))]:[];
function emgCheck(){if(!SES)return;const M=emgMie(),mia=emgMia(),seen=S.emgSeen||(S.emgSeen={});

 else{const sv=DB.servizi[e.servizioId]||{titolo:'Servizio',luogo:''},al=!!M[0],ad=role()==='admin',pr=al&&(ad||role()==='tecnico'&&inCampo(e.servizioId));

   document.body.appendChild(o);clearInterval(S.emgCd);const cd=()=>{const x=$('#emgCd'),r=Math.ceil((e.ts+EMG_AV-Date.now())/1e3);if(!x)return clearInterval(S.emgCd);x.textContent=r>0?`Tra ${r} secondi i volontari in servizio vengono geolocalizzati (anche senza consenso privacy).`:'📍 Geolocalizzazione dei volontari in servizio attiva: la posizione arriva all\'amministratore'+(lic('emergCl')?' e al cliente.':'.');if(r===0)emgGps()};cd();S.emgCd=setInterval(cd,1e3);

 emgGps();if(S.emgMap)emgMapRefresh()}

// allarme: sirena (Web Audio), vibrazione ripetuta, flash del telefono (solo Android, con il permesso della fotocamera) e schermo sempre acceso
const AL={on:0};
function allarmeOn(){if(AL.on)return;AL.on=1;
 try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume?.();const o=AC.createOscillator(),g=AC.createGain();o.type='square';g.gain.value=.22;o.connect(g);g.connect(AC.destination);o.start();AL.o=o;let up=0;AL.si=setInterval(()=>{up^=1;try{o.frequency.setValueAtTime(up?1250:760,AC.currentTime)}catch{}},420)}catch{}

function allarmeOff(){if(!AL.on)return;AL.on=0;clearInterval(AL.si);clearInterval(AL.vi);try{AL.o?.stop()}catch{}AL.o=null;try{navigator.vibrate?.(0)}catch{}torcia(0);try{AL.wl?.release()}catch{}AL.wl=null}
async function torcia(on){if(!on){clearInterval(AL.ti);try{AL.tt?.stop()}catch{}AL.tt=null;return}if(IOS||!navigator.mediaDevices?.getUserMedia)return;
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}),t=st.getVideoTracks()[0];if(!AL.on||!t.getCapabilities?.().torch){st.getTracks().forEach(x=>x.stop());return}AL.tt=t;let x=0;AL.ti=setInterval(()=>{x^=1;t.applyConstraints({advanced:[{torch:!!x}]}).catch(()=>{})},400)}catch{}}

 S.emgW=navigator.geolocation.watchPosition(p=>{const n=Date.now();if(n-(S.emgLt||0)<15e3)return;S.emgLt=n;const ls=emgGpsOn();for(const sid of ls)put('posizioni',{id:sid+'_'+SES.uid,servizioId:sid,utenteId:SES.uid,lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),ts:n});
